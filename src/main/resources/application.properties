# Application
spring.application.name=BookMyShow

# H2 Database (in-memory for development)
spring.datasource.url=jdbc:h2:mem:bookmyshowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
# IMPORTANT: In production, set APP_JWT_SECRET environment variable with a securely generated 256-bit Base64-encoded key.
# Example: export APP_JWT_SECRET=$(openssl rand -base64 32)
app.jwt.secret=${APP_JWT_SECRET:bm9zZWN1cmVzZWNyZXRrZXlmb3Jib29rbXlzaG93YXBwbGljYXRpb25ub3Byb2Q=}
app.jwt.expiration-ms=86400000

# Server
server.port=8080

spring.jpa.open-in-view=false

# Logging
logging.level.com.bookmyshow=INFO
logging.level.org.springframework.security=WARN
